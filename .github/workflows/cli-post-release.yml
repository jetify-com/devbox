name: cli-post-release
# Legacy: promote the release on releases.jetify.com once it's published.
#
# The installer (install.sh) and the launcher in devbox releases after 0.20.0 find
# the latest stable version from GitHub itself
# (releases/latest/download/checksums.txt), so publishing a release as
# "latest" is all a release needs. devbox 0.20.0 and older, and the old bash
# launcher, still read s3://releases.jetpack.io/devbox/stable/version, so this
# keeps it in sync for them. Failures don't affect new installs. Delete this
# workflow once those versions are gone.

on:
  release:
    types: [released]

permissions:
  contents: write
  pull-requests: read
  id-token: write # Needed for aws-actions/configure-aws-credentials@v6

jobs:
  # Make sure the cli-release workflow that built this tag actually succeeded
  # before we promote it to stable. The `released` event can fire even when
  # cli-release failed partway (or a release was published by other means), so
  # guard against finalizing a broken release.
  check-release:
    permissions:
      actions: read
      contents: read
    runs-on: ubuntu-latest
    steps:
      # The `released` event can fire before the cli-release run has finished,
      # so wait for it to complete. The action exits with failure if the waited
      # workflow failed, which blocks the publish job below.
      - name: Wait for cli-release to succeed for this tag
        uses: int128/wait-for-workflows-action@v1.110.0
        with:
          sha: ${{ github.sha }}
          # cli-release is triggered by the tag push, not the release event.
          filter-workflow-events: push
          filter-workflow-names: cli-release

  publish:
    runs-on: ubuntu-latest
    environment: release
    needs: check-release
    steps:
      - name: Configure AWS Credentials
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: us-west-2
      - name: Update latest version in s3
        continue-on-error: true
        run: |
          tmp_file=$(mktemp)
          echo "${{ github.ref_name }}" > $tmp_file
          aws s3 cp $tmp_file s3://releases.jetpack.io/devbox/stable/version
