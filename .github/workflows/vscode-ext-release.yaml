name: vscode-ext-release
# Releases the Devbox VSCode extension to the marketplace

concurrency: vscode-ext-release

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build-publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup NodeJS 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install dependencies
        run: |
          corepack enable
          npm install -g @vscode/vsce ovsx
          yarn install --immutable
        working-directory: vscode-extension
      # vsce/ovsx --yarn run `yarn list`, which Yarn 4 doesn't have, so we
      # package with --no-yarn (npm list over the node_modules tree that Yarn
      # created with nodeLinker: node-modules) and publish the built .vsix.
      - name: publish-vs
        run: |
          vsce package --no-yarn -o devbox-vs.vsix
          vsce publish -p ${{ secrets.VS_MARKETPLACE_TOKEN }} --packagePath devbox-vs.vsix --skip-duplicate
        working-directory: vscode-extension
      - name: publish-ovsx
        run: |
          sed -i 's/"publisher": "jetpack-io"/"publisher": "Jetify"/g' package.json
          vsce package --no-yarn -o devbox-ovsx.vsix
          ovsx publish devbox-ovsx.vsix --pat ${{ secrets.OVSX_MARKETPLACE_TOKEN }} --skip-duplicate
        working-directory: vscode-extension
