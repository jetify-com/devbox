name: docker-image-release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'tag name'
        required: true
        default: ''
        type: string
      push_latest:
        description: 'Also move the `latest` tag to this build?'
        required: false
        default: true
        type: boolean

jobs:
  docker-image-build-push:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
      - name: Decide whether to move the `latest` tag
        id: latest
        # Prereleases must not become `latest`. Publishing 0.17.0-dev and
        # 0.17.0-deva each overwrote jetpackio/devbox:latest with a prerelease.
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "push=${{ github.event.release.prerelease && 'false' || 'true' }}" >> "$GITHUB_OUTPUT"
          else
            echo "push=${{ inputs.push_latest }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            jetpackio/devbox
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
          flavor: |
            latest=false
      - name: Docker meta root
        id: metaroot
        uses: docker/metadata-action@v6
        with:
          images: |
            jetpackio/devbox-root-user
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
          flavor: |
            latest=false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - name: Build and push default
        uses: docker/build-push-action@v7
        with:
          context: ./internal/devbox/generate/tmpl/
          file: ./internal/devbox/generate/tmpl/DevboxImageDockerfile
          build-args: |
            DEVBOX_USE_VERSION=${{ inputs.tag || github.ref_name }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
      - name: Build and push root user
        uses: docker/build-push-action@v7
        with:
          context: ./internal/devbox/generate/tmpl/
          file: ./internal/devbox/generate/tmpl/DevboxImageDockerfileRootUser
          build-args: |
            DEVBOX_USE_VERSION=${{ inputs.tag || github.ref_name }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metaroot.outputs.tags }}
      - name: Docker meta latest
        id: metalatest
        if: steps.latest.outputs.push == 'true'
        uses: docker/metadata-action@v6
        with:
          images: |
            jetpackio/devbox
          tags: |
            type=raw,value=latest
          flavor: |
            latest=true
      - name: Build and push latest
        if: steps.latest.outputs.push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./internal/devbox/generate/tmpl/
          file: ./internal/devbox/generate/tmpl/DevboxImageDockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metalatest.outputs.tags }}
      - name: Docker meta root latest
        id: metarootlatest
        if: steps.latest.outputs.push == 'true'
        uses: docker/metadata-action@v6
        with:
          images: |
            jetpackio/devbox-root-user
          tags: |
            type=raw,value=latest
          flavor: |
            latest=true
      - name: Build and push root user latest
        if: steps.latest.outputs.push == 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./internal/devbox/generate/tmpl/
          file: ./internal/devbox/generate/tmpl/DevboxImageDockerfileRootUser
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.metarootlatest.outputs.tags }}
