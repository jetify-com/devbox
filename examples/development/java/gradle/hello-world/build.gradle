plugins {
    id 'java'
    id 'application'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'hello.HelloWorld'
}

jar {
    manifest {
        attributes 'Main-Class': 'hello.HelloWorld'
    }
}
